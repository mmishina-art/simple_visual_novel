<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- 夕方の庭。乾いた井戸と、その縁に座る猫（『日曜日、井戸の底で』の表紙・背景） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d90b8"/>
      <stop offset="0.55" stop-color="#c9a98e"/>
      <stop offset="1" stop-color="#ecd9ae"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6e4e"/>
      <stop offset="1" stop-color="#3d4c33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="650" cy="150" r="42" fill="#f7e3ae" opacity="0.9"/>
  <circle cx="650" cy="150" r="70" fill="#f7e3ae" opacity="0.25"/>
  <!-- 遠くの屋根と木立 -->
  <path d="M0 330 L120 260 L260 330 Z" fill="#4a5570"/>
  <rect x="60" y="330" width="140" height="60" fill="#57627c"/>
  <circle cx="730" cy="300" r="70" fill="#44543c"/>
  <circle cx="40" cy="320" r="56" fill="#4c5c40"/>
  <!-- 地面 -->
  <rect y="380" width="800" height="220" fill="url(#ground)"/>
  <ellipse cx="400" cy="560" rx="330" ry="34" fill="#33402a" opacity="0.55"/>
  <!-- 井戸小屋の柱と屋根 -->
  <rect x="252" y="238" width="16" height="196" fill="#5d4630"/>
  <rect x="532" y="238" width="16" height="196" fill="#5d4630"/>
  <path d="M218 244 L400 176 L582 244 L556 244 L400 190 L244 244 Z" fill="#6d5138"/>
  <rect x="238" y="238" width="324" height="10" fill="#54402a"/>
  <!-- 滑車とロープと桶 -->
  <circle cx="400" cy="252" r="10" fill="#3d2f1f"/>
  <line x1="400" y1="252" x2="400" y2="316" stroke="#c9b890" stroke-width="5"/>
  <path d="M376 316 L424 316 L418 348 L382 348 Z" fill="#7a5c3a"/>
  <line x1="376" y1="316" x2="424" y2="316" stroke="#54402a" stroke-width="4"/>
  <!-- 石積みの井戸 -->
  <ellipse cx="400" cy="428" rx="168" ry="34" fill="#2c2c30"/>
  <path d="M232 428 L232 500 Q232 528 268 528 L532 528 Q568 528 568 500 L568 428 Z" fill="#8d8d94"/>
  <ellipse cx="400" cy="428" rx="168" ry="34" fill="#a5a5ab"/>
  <ellipse cx="400" cy="428" rx="138" ry="25" fill="#17171c"/>
  <g stroke="#6e6e75" stroke-width="4" opacity="0.8">
    <line x1="250" y1="462" x2="550" y2="462"/>
    <line x1="238" y1="496" x2="562" y2="496"/>
    <line x1="310" y1="434" x2="310" y2="462"/>
    <line x1="410" y1="434" x2="410" y2="462"/>
    <line x1="500" y1="434" x2="500" y2="462"/>
    <line x1="360" y1="462" x2="360" y2="496"/>
    <line x1="460" y1="462" x2="460" y2="496"/>
  </g>
  <!-- 縁に座る猫（シルエット） -->
  <g fill="#23222a">
    <ellipse cx="520" cy="404" rx="26" ry="12"/>
    <path d="M498 406 Q492 372 512 362 L516 348 L524 360 L538 348 L542 362 Q560 370 556 404 Q540 414 520 414 Q504 414 498 406 Z"/>
    <path d="M552 402 Q578 396 576 374 Q574 360 564 354" fill="none" stroke="#23222a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- 草むら -->
  <g stroke="#2f4023" stroke-width="5" stroke-linecap="round">
    <path d="M120 540 q4 -22 -4 -34"/>
    <path d="M138 542 q10 -18 22 -24"/>
    <path d="M660 548 q4 -22 -4 -34"/>
    <path d="M678 550 q10 -18 22 -24"/>
    <path d="M210 566 q4 -18 -4 -28"/>
    <path d="M596 570 q10 -14 20 -20"/>
  </g>
</svg>
